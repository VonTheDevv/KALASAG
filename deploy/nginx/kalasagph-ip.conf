# HTTP bootstrap deployment for the VPS public IPv4 address and domain.
# Replace this with the HTTPS production configuration after certificate issue.

limit_req_zone $binary_remote_addr zone=kalasag_app_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=kalasag_address_per_ip:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=kalasag_connections_per_ip:10m;

map $http_origin $kalasag_address_origin_allowed {
    default 0;
    "" 1;
    "https://localhost" 1;
    "capacitor://localhost" 1;
}

log_format kalasag_noargs
  '$remote_addr [$time_local] '
  '"$request_method $uri $server_protocol" $status $body_bytes_sent '
  '"$http_user_agent"';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name 104.43.88.93 kalasagph.tech www.kalasagph.tech;

    root /var/www/kalasagph/current;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;
    limit_conn kalasag_connections_per_ip 20;

    access_log /var/log/nginx/kalasag.access.log kalasag_noargs;
    error_log /var/log/nginx/kalasag.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://*.googleusercontent.com https://*.supabase.co https://controlmap.mgb.gov.ph https://ulap-hazards.georisk.gov.ph; media-src 'self' blob: https://*.supabase.co; connect-src 'self' data: blob: https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; manifest-src 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location = /api/address-search {
        if ($kalasag_address_origin_allowed = 0) { return 403; }
        if ($arg_q = "") { return 400; }

        limit_req zone=kalasag_address_per_ip burst=5 nodelay;
        limit_except GET { deny all; }

        proxy_pass https://photon.komoot.io/api;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name photon.komoot.io;
        proxy_set_header Host photon.komoot.io;
        proxy_set_header User-Agent "KALASAG/1.0 (address-autocomplete)";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        expires -1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location = /index.html {
        try_files $uri =404;
        expires -1;
    }

    location = /sw.js {
        try_files $uri =404;
        expires -1;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        expires -1;
    }

    location / {
        limit_req zone=kalasag_app_per_ip burst=40 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location ~* ^/assets/.*\.(?:css|js|png|jpg|jpeg|webp|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 1y;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location ~* \.(?:map|env|sql|mjs|cjs|ts|tsx)$ {
        return 404;
    }
}
