# Production Nginx configuration for kalasagph.tech.

limit_req_zone $binary_remote_addr zone=kalasag_app_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=kalasag_address_per_ip:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=kalasag_news_relay_per_ip:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=kalasag_connections_per_ip:10m;

map $http_origin $kalasag_address_origin_allowed {
    default 0;
    "" 1;
    "https://kalasagph.tech" 1;
    "https://localhost" 1;
    "capacitor://localhost" 1;
}

log_format kalasag_noargs
  '$remote_addr [$time_local] '
  '"$request_method $uri $server_protocol" $status $body_bytes_sent '
  '"$http_user_agent"';

ssl_session_timeout 1d;
ssl_session_cache shared:KalasagTLS:10m;
ssl_session_tickets off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name 104.43.88.93;

    access_log /var/log/nginx/kalasag.access.log kalasag_noargs;
    error_log /var/log/nginx/kalasag.error.log warn;

    return 301 https://kalasagph.tech$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name kalasagph.tech www.kalasagph.tech;

    access_log /var/log/nginx/kalasag.access.log kalasag_noargs;
    error_log /var/log/nginx/kalasag.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://kalasagph.tech$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/kalasagph.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kalasagph.tech/privkey.pem;
    access_log off;

    return 444;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kalasagph.tech;

    ssl_certificate /etc/letsencrypt/live/kalasagph.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kalasagph.tech/privkey.pem;

    access_log /var/log/nginx/kalasag.access.log kalasag_noargs;
    error_log /var/log/nginx/kalasag.error.log warn;

    add_header Strict-Transport-Security "max-age=86400" always;
    return 301 https://kalasagph.tech$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kalasagph.tech;

    root /var/www/kalasagph/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/kalasagph.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kalasagph.tech/privkey.pem;

    server_tokens off;
    client_max_body_size 1m;
    limit_conn kalasag_connections_per_ip 20;

    access_log /var/log/nginx/kalasag.access.log kalasag_noargs;
    error_log /var/log/nginx/kalasag.error.log warn;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://*.googleusercontent.com https://*.supabase.co https://controlmap.mgb.gov.ph https://ulap-hazards.georisk.gov.ph; media-src 'self' blob: https://*.supabase.co; connect-src 'self' data: blob: https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Cyclone requests use the bounded loopback relay. Other resources continue
    # through the hosted function with its audited origin.
    location = /api/live-data {
        if ($arg_resource = landslide-image) { return 410; }
        error_page 418 = @kalasag_storm_feed;
        if ($arg_resource = storms) { return 418; }

        limit_req zone=kalasag_app_per_ip burst=40 nodelay;

        proxy_pass https://arkvqihazxrfdxuwzqur.supabase.co/functions/v1/live-data;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name arkvqihazxrfdxuwzqur.supabase.co;
        proxy_set_header Host arkvqihazxrfdxuwzqur.supabase.co;
        proxy_set_header Origin https://localhost;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    location @kalasag_storm_feed {
        limit_req zone=kalasag_app_per_ip burst=40 nodelay;

        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 5s;
    }

    # Authenticated server-to-server publisher feed relay. The loopback
    # service accepts only frozen source IDs; it is not a general URL proxy.
    location = /internal/news-source {
        limit_req zone=kalasag_news_relay_per_ip burst=10 nodelay;
        limit_except GET HEAD { deny all; }

        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Kalasag-News-Relay-Secret $http_x_kalasag_news_relay_secret;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 5s;
    }

    # Address autocomplete stays server-side and is deliberately rate-limited
    # to remain within the public Photon service's reasonable-use allowance.
    location = /api/address-search {
        if ($kalasag_address_origin_allowed = 0) { return 403; }
        if ($arg_q = "") { return 400; }

        limit_req zone=kalasag_address_per_ip burst=5 nodelay;
        limit_except GET { deny all; }

        proxy_pass https://photon.komoot.io/api;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name photon.komoot.io;
        proxy_set_header Host photon.komoot.io;
        proxy_set_header User-Agent "KALASAG/1.0 (address-autocomplete)";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        expires -1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location = /index.html {
        try_files $uri =404;
        expires -1;
    }

    location = /sw.js {
        try_files $uri =404;
        expires -1;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        expires -1;
    }

    location / {
        limit_req zone=kalasag_app_per_ip burst=40 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location ~* ^/assets/.*\.(?:css|js|png|jpg|jpeg|webp|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 1y;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location ~* \.(?:map|env|sql|mjs|cjs|ts|tsx)$ {
        return 404;
    }
}
